name: SOMI Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag di versione per la release (es. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SOMI-${TAG_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          name: "SOMI Release ${{ github.ref_name || github.event.inputs.version_tag }}"
          body: |
            ## SOMI - Addestramento Soccorritore Militare (Esercito Italiano)
            
            ### Novità di questa versione:
            - Simulazione scenari TCCC (Algoritmo MARCH - Moduli M e A).
            - Generatore probabilistico ferite articolari e giunzionali con foro di uscita e scala AVPU.
            - Timer tattici dedicati per Emorragia Massiva e Vie Aeree.
            - Popup di debriefing clinico-tattico a conclusione dello scenario.
            - Sistema di auto-aggiornamento integrato nell'applicazione via GitHub Releases.
          files: |
            release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
